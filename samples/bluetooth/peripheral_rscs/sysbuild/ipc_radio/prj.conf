CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y

CONFIG_ASSERT=y

CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

# If build from SDC or MPSL from sources is needed
#CONFIG_MPSL_BUILD_TYPE_SRC_DEBUG=y
#CONFIG_BT_LL_SOFTDEVICE_BUILD_TYPE_SRC_DEBUG=y

CONFIG_PM=y
CONFIG_POWEROFF=y

# Optionally Disable all configs that allow for printing on uart
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_GPIO=n
CONFIG_BOOT_BANNER=n
